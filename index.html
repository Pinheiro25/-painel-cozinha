<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Quarto do Buda</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15120f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#wrap{height:100%;padding:18px;background:radial-gradient(circle at 50% 30%,#382b1e 0,#1c1712 55%,#100e0c 100%)}
#top{height:20%;display:table;width:100%;padding:0 22px;border:1px solid rgba(255,255,255,.11);border-radius:22px;background:rgba(0,0,0,.22)}
#clockbox,#weatherbox{display:table-cell;vertical-align:middle}
#clockbox{width:58%}#weatherbox{text-align:right}
#room{font-size:18px;color:#d4bd99;letter-spacing:2px;text-transform:uppercase}
#clock{font-size:68px;font-weight:200;line-height:1;margin-top:4px}
#date{font-size:17px;color:#b9aa96;margin-top:5px}
#weather{font-size:34px}.sub{font-size:15px;color:#b9aa96;margin-top:5px}
#main{height:77%;margin-top:3%;display:table;width:100%;border-spacing:14px 0}
.col{display:table-cell;vertical-align:top}.primary{width:58%}.secondary{width:42%}
.card{height:100%;padding:22px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:rgba(255,255,255,.07)}
h1{font-size:30px;margin:0 0 5px;font-weight:600}#status{font-size:16px;color:#cdbb9f;margin-bottom:18px}
.powerRow{display:table;width:100%;table-layout:fixed;border-spacing:8px 0;margin-bottom:16px}
.power{display:table-cell;height:92px;border:0;border-radius:20px;color:#fff;font-size:25px;font-weight:600;vertical-align:middle}
.on{background:#c99445}.off{background:#514941}.mode{display:block;width:100%;height:68px;margin:11px 0;border:1px solid rgba(255,255,255,.15);border-radius:17px;background:#76624b;color:#fff;font-size:22px}
.mode.white{background:#f2e8d5;color:#3d342c}.mode.colour{background:linear-gradient(90deg,#b34848,#b6873d,#4e9569,#4f78a6,#8758a0)}
.label{font-size:15px;color:#d4bd99;margin:17px 0 8px;text-transform:uppercase;letter-spacing:1px}
#brightness{width:100%;height:35px}.value{text-align:center;font-size:16px;color:#cdbb9f}
.colors{display:table;width:100%;table-layout:fixed;border-spacing:8px 10px}
.colorRow{display:table-row}.color{display:table-cell;height:72px;border:4px solid rgba(255,255,255,.24);border-radius:18px}
.red{background:#d84949}.amber{background:#e49a3b}.green{background:#43a76b}.blue{background:#3f79d7}.purple{background:#9258bd}.pink{background:#d65c91}
.feedback{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 20px;border-radius:18px;background:rgba(0,0,0,.85);font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none}.feedback.show{opacity:1}
button:active,.color:active{transform:scale(.97);opacity:.82}
@media(max-width:700px){#wrap{padding:10px}#top{height:18%}#clock{font-size:50px}#main{height:79%;margin-top:3%;border-spacing:8px 0}.card{padding:14px}h1{font-size:24px}.power{height:78px}.mode{height:58px}.color{height:58px}}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div id="clockbox">
      <div id="room">Quarto do Buda</div>
      <div id="clock">--:--</div>
      <div id="date">Carregando data…</div>
    </div>
    <div id="weatherbox">
      <div id="weather">🌤️ --°C</div>
      <div id="weatherExtra" class="sub">Votorantim</div>
    </div>
  </div>

  <div id="main">
    <div class="col primary">
      <div class="card">
        <h1>💡 Luz do Closet</h1>
        <div id="status">B3 e B4 prontas</div>
        <div class="powerRow">
          <button class="power on" onclick="window.sendTuya('on')">LIGAR</button>
          <button class="power off" onclick="window.sendTuya('off')">DESLIGAR</button>
        </div>
        <button class="mode white" onclick="window.sendTuya('white')">☀️ BRANCO</button>
        <button class="mode colour" onclick="window.sendTuya('color','&h=240&s=900&v=900')">🎨 COLORIDO</button>
        <div class="label">Brilho</div>
        <input id="brightness" type="range" min="10" max="1000" step="10" value="800" onchange="window.setBrightness(this.value)">
        <div id="brightValue" class="value">80%</div>
      </div>
    </div>

    <div class="col secondary">
      <div class="card">
        <h1>Cores rápidas</h1>
        <div class="colors">
          <div class="colorRow">
            <button class="color red" aria-label="Vermelho" onclick="window.setColor(0)"></button>
            <button class="color amber" aria-label="Âmbar" onclick="window.setColor(35)"></button>
          </div>
          <div class="colorRow">
            <button class="color green" aria-label="Verde" onclick="window.setColor(125)"></button>
            <button class="color blue" aria-label="Azul" onclick="window.setColor(220)"></button>
          </div>
          <div class="colorRow">
            <button class="color purple" aria-label="Roxo" onclick="window.setColor(275)"></button>
            <button class="color pink" aria-label="Rosa" onclick="window.setColor(325)"></button>
          </div>
        </div>
        <div class="sub" style="text-align:center;margin-top:8px">Toque em uma cor para aplicar nas duas lâmpadas</div>
      </div>
    </div>
  </div>
</div>
<div id="feedback" class="feedback">Enviando…</div>

<script>
(function(){
  var API='https://script.google.com/macros/s/AKfycbzKhDTHTy-wGRvU4CqYcejwgSn8-eSCZFwqzO2hIQt7dCHQsxK4un_0VMlBRPe8msgtGA/exec';
  var days=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  var months=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var requestNumber=0;
  function pad(n){return n<10?'0'+n:n}
  function tick(){var d=new Date();document.getElementById('clock').innerHTML=pad(d.getHours())+':'+pad(d.getMinutes());document.getElementById('date').innerHTML=days[d.getDay()]+', '+d.getDate()+' de '+months[d.getMonth()]}
  tick();setInterval(tick,1000);
  function weatherText(c){if(c===0)return['☀️','Céu limpo'];if(c<=2)return['🌤️','Poucas nuvens'];if(c===3)return['☁️','Nublado'];if(c>=51&&c<=82)return['🌧️','Chuva'];if(c>=95)return['⛈️','Trovoadas'];return['🌤️','Tempo em Votorantim']}
  function loadWeather(){var x=new XMLHttpRequest(),u='https://api.open-meteo.com/v1/forecast?latitude=-23.54&longitude=-47.45&current_weather=true&timezone=America%2FSao_Paulo&_='+new Date().getTime();x.onreadystatechange=function(){if(x.readyState===4&&x.status>=200&&x.status<300){try{var w=JSON.parse(x.responseText).current_weather,d=weatherText(Number(w.weathercode));document.getElementById('weather').innerHTML=d[0]+' '+Math.round(w.temperature)+'°C';document.getElementById('weatherExtra').innerHTML=d[1]+' · vento '+Math.round(w.windspeed)+' km/h'}catch(e){}}};x.open('GET',u,true);x.send()}
  loadWeather();setInterval(loadWeather,10*60*1000);
  window.sendTuya=function(action,extra){var n=++requestNumber,cb='tuyaCallback'+n,s=document.createElement('script');show('Enviando…');window[cb]=function(data){show(data&&data.ok?'Pronto':'Não foi possível concluir');document.getElementById('status').innerHTML=data&&data.ok?'Comando enviado para B3 e B4':'Verifique a conexão';try{delete window[cb]}catch(e){window[cb]=null}if(s.parentNode)s.parentNode.removeChild(s)};s.src=API+'?action='+encodeURIComponent(action)+(extra||'')+'&callback='+cb+'&_='+new Date().getTime();s.onerror=function(){show('Sem conexão com o controle')};document.body.appendChild(s)};
  window.setColor=function(h){window.sendTuya('color','&h='+h+'&s=1000&v=900')};
  window.setBrightness=function(v){document.getElementById('brightValue').innerHTML=Math.round(Number(v)/10)+'%';window.sendTuya('brightness','&value='+v)};
  function show(t){var f=document.getElementById('feedback');f.innerHTML=t;f.className='feedback show';setTimeout(function(){f.className='feedback'},1800)}
  setTimeout(function(){location.reload(true)},6*60*60*1000);
})();
</script>
</body>
</html>
